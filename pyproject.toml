[project]
name = "soundboard-ai"
version = "1.0.0"
description = "Digital Soundboard for VB-Audio Cable with Local AI Speaker ID, Transcription, Acoustic Mood & Replay Buffer"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pyaudiowpatch>=0.2.12.6",
    "sherpa-onnx>=1.10.0",
    "faster-whisper>=1.0.0",
    "keyboard>=0.13.5",
    "pywebview>=5.0",
    "huggingface_hub>=0.23.0",
    "pystray>=0.19.5",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
